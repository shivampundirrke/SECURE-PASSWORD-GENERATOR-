<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure Password Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0f172a;color:#f8fafc;font-family:Arial,sans-serif}
.card{width:100%;max-width:430px;background:#1e293b;padding:28px;border-radius:18px;box-shadow:0 15px 40px #0005}
h1{text-align:center;font-size:27px;margin-top:0}.sub{text-align:center;color:#cbd5e1}
.output{display:flex;gap:8px;margin:22px 0}.output input{flex:1;min-width:0;background:#0f172a;color:#4ade80;border:1px solid #475569;padding:13px;border-radius:8px;font-size:15px}
button{cursor:pointer;border:0;border-radius:8px;padding:12px 15px;background:#38bdf8;color:#082f49;font-weight:bold}.row{display:flex;justify-content:space-between;align-items:center;margin:15px 0}.row label{color:#e2e8f0}input[type=range]{width:100%;accent-color:#38bdf8}.generate{width:100%;margin-top:12px;font-size:16px}.status{min-height:22px;color:#4ade80;font-size:14px}
</style>
</head>
<body><main class="card">
<h1>🔐 Password Generator</h1><p class="sub">Create a strong random password</p>
<div class="output"><input id="password" readonly placeholder="Your password appears here"><button id="copy">Copy</button></div>
<div class="row"><label for="length">Password length</label><strong id="lengthValue">12</strong></div>
<input id="length" type="range" min="6" max="32" value="12">
<div class="row"><label for="upper">Uppercase (A-Z)</label><input id="upper" type="checkbox" checked></div>
<div class="row"><label for="lower">Lowercase (a-z)</label><input id="lower" type="checkbox" checked></div>
<div class="row"><label for="numbers">Numbers (0-9)</label><input id="numbers" type="checkbox" checked></div>
<div class="row"><label for="symbols">Symbols (!@#$)</label><input id="symbols" type="checkbox" checked></div>
<p>Strength: <strong id="strength">Not generated</strong></p>
<button class="generate" id="generate">Generate Password</button><p class="status" id="message" role="status"></p>
</main>
<script>
const $=id=>document.getElementById(id);
$("length").addEventListener("input",()=>$("lengthValue").textContent=$("length").value);
function randomIndex(max){const a=new Uint32Array(1),limit=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}
function generatePassword(){
 const groups=[];
 if($("upper").checked)groups.push("ABCDEFGHIJKLMNOPQRSTUVWXYZ");
 if($("lower").checked)groups.push("abcdefghijklmnopqrstuvwxyz");
 if($("numbers").checked)groups.push("0123456789");
 if($("symbols").checked)groups.push("!@#$%^&*()_+-=");
 if(!groups.length){$("message").textContent="Select at least one character type.";return}
 const n=Number($("length").value),all=groups.join("");
 const chars=groups.map(g=>g[randomIndex(g.length)]);
 while(chars.length<n)chars.push(all[randomIndex(all.length)]);
 for(let i=chars.length-1;i>0;i--){const j=randomIndex(i+1);[chars[i],chars[j]]=[chars[j],chars[i]]}
 $("password").value=chars.join("");$("message").textContent="Password generated successfully!";
 $("strength").textContent=n>=16&&groups.length>=3?"Strong":n>=10&&groups.length>=2?"Medium":"Weak";
}
$("generate").addEventListener("click",generatePassword);
$("copy").addEventListener("click",async()=>{if(!$("password").value){$("message").textContent="Generate a password first.";return}
 try{await navigator.clipboard.writeText($("password").value);$("message").textContent="Password copied!"}
 catch{$("message").textContent="Clipboard unavailable; select and copy manually."}});
</script></body></html>
